name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # leidžia paleisti ranka iš Actions skirtuko

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 7 reikalauja JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Build web assets
        run: npm run build

      # android/ yra .gitignore'e, todėl platforma generuojama iš naujo kiekvieną kartą
      - name: Add Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      # android/ generuojamas iš naujo kiekvieną kartą, todėl leidimai ir pranešimų
      # piktograma įrašomi čia — rankiniai pakeitimai iki CI nepasiektų.
      - name: Patch AndroidManifest permissions
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          x = p.read_text(encoding="utf-8")
          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]
          add = "".join(f'    <uses-permission android:name="{n}" />\n'
                        for n in perms if n not in x)
          if add:
              x = re.sub(r"(\n)(\s*</manifest>)", r"\n" + add + r"\2", x, count=1)
              p.write_text(x, encoding="utf-8")
          print(x)
          PY

      # Be šito APK gautų numatytąją Capacitor piktogramą: assets/ katalogas pats
      # savaime niekur nepatenka. Įrankis ieško būtent icon-only / icon-foreground /
      # icon-background / splash / splash-dark vardų.
      - name: Generate launcher icons and splash
        run: npx @capacitor/assets generate --android

      - name: Install notification icons
        run: |
          set -e
          declare -A M=( [mdpi]=24 [hdpi]=48 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          for d in "${!M[@]}"; do
            dir="android/app/src/main/res/drawable-$d"
            mkdir -p "$dir"
            cp "assets/ic_stat_aura_${M[$d]}.png" "$dir/ic_stat_aura.png"
          done
          ls -R android/app/src/main/res/drawable-*dpi

      # Android 13+ temuota piktograma. @capacitor/assets jos negeneruoja, o
      # <monochrome> įrašo į ic_launcher.xml nėra – be jo sluoksnis būtų ignoruotas.
      - name: Install monochrome (themed) icon
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$d"
            mkdir -p "$dir"
            cp "assets/ic_launcher_monochrome_$d.png" "$dir/ic_launcher_monochrome.png"
          done
          python3 - <<'PY'
          import pathlib, re
          added = []
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              p = pathlib.Path("android/app/src/main/res/mipmap-anydpi-v26") / name
              if not p.exists():
                  continue
              x = p.read_text(encoding="utf-8")
              if "monochrome" in x:
                  continue
              x = x.replace("</adaptive-icon>",
                            '    <monochrome android:drawable="@mipmap/ic_launcher_monochrome"/>\n</adaptive-icon>')
              p.write_text(x, encoding="utf-8")
              added.append(name)
              print(x)
          print("papildyta:", added or "nieko")
          PY

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
